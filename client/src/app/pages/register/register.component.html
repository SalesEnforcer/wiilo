<div class="min-h-screen flex flex-col items-center justify-center bg-[#f8fafc] px-4 py-10">
  
  <!-- Logo Header -->
  <div class="mb-8 text-center">
    <div class="mx-auto h-12 w-12 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-blue-200 mb-4">
      W
    </div>
    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Initialize Agency</h1>
    <p class="text-slate-500 text-sm mt-2">Create your secure workspace.</p>
  </div>

  <!-- Register Card -->
  <div class="bg-white w-full max-w-[450px] rounded-2xl shadow-sm border border-slate-200 p-8">
    
    <form (submit)="onSubmit()" class="space-y-4">
      
      <!-- Agency Name -->
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Agency Name</label>
        <input [(ngModel)]="orgName" name="orgName" type="text" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Acme Digital" required>
      </div>

      <!-- Full Name -->
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Admin Name</label>
        <input [(ngModel)]="name" name="name" type="text" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="John Doe" required>
      </div>

      <!-- Email -->
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Work Email</label>
        <input [(ngModel)]="email" name="email" type="email" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="admin@agency.com" required>
      </div>

      <!-- Password -->
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Password</label>
        <input [(ngModel)]="password" name="password" type="password" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="????????" required>
      </div>

      <!-- Action -->
      <button 
        type="submit" 
        class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition-all duration-200 shadow-sm shadow-blue-200 mt-4 flex justify-center items-center gap-2">
        <span>Deploy Workspace</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
      </button>

      <!-- Footer -->
      <div class="text-center pt-4 border-t border-slate-100 mt-2">
        <p class="text-sm text-slate-500">
          Already live? <a routerLink="/login" class="text-blue-600 font-bold hover:underline cursor-pointer">Login</a>
        </p>
      </div>
    </form>
  </div>
</div>
