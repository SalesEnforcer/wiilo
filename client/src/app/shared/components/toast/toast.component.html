<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto min-w-[300px] p-4 rounded-lg shadow-lg border-l-4 flex items-center gap-3 animate-slide-in bg-white text-slate-800"
      [class.border-green-500]="toast.type === 'success'"
      [class.border-red-500]="toast.type === 'error'"
      [class.border-blue-500]="toast.type === 'info'">
      
      <!-- Icons -->
      @if (toast.type === 'success') {
        <svg class="w-5 h-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
      } @else if (toast.type === 'error') {
        <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      } @else {
        <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      }

      <span class="text-sm font-medium">{{ toast.message }}</span>
    </div>
  }
</div>
