<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
    <div>
      <h1 class="font-headline-md text-headline-md text-on-surface">Team Roster</h1>
      <p class="text-sm text-on-surface-variant mt-0.5">Manage access and roles</p>
    </div>
    <button (click)="showModal = true" class="bg-primary text-on-primary px-4 py-2.5 rounded-xl hover:bg-on-primary-fixed-variant transition-colors font-semibold text-sm inline-flex items-center gap-1.5">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
      Invite Member
    </button>
  </div>

  <!-- Team Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (user of teamService.members(); track user._id) {
      <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant p-5 hover:shadow-sm transition-shadow flex items-center gap-4">
        <div class="h-11 w-11 rounded-xl bg-surface-container flex items-center justify-center text-on-surface-variant font-bold text-sm border border-outline-variant/50 shrink-0">
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-on-surface text-sm truncate">{{ user.name }}</div>
          <div class="text-xs text-on-surface-variant truncate mt-0.5">{{ user.email }}</div>
          <div class="mt-2">
            <span class="inline-flex px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-wider"
              [class.bg-purple-50]="user.role === 'superadmin'" [class.text-purple-700]="user.role === 'superadmin'"
              [class.bg-blue-50]="user.role === 'dev'" [class.text-blue-700]="user.role === 'dev'"
              [class.bg-green-50]="user.role === 'client'" [class.text-green-700]="user.role === 'client'">
              {{ user.role }}
            </span>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<!-- Invite Modal -->
@if (showModal) {
<div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-md shadow-xl border border-outline-variant overflow-hidden">
    <div class="px-5 py-4 border-b border-outline-variant/50">
      <h2 class="font-headline-md text-headline-md text-on-surface">Invite New Member</h2>
    </div>

    <form (submit)="onSubmit()" class="p-5 space-y-4">
      <div>
        <label class="block text-[11px] font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">Full Name</label>
        <input [(ngModel)]="newUser.name" name="name" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-3.5 py-2.5 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" required>
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">Email</label>
        <input [(ngModel)]="newUser.email" name="email" type="email" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-3.5 py-2.5 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" required>
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">Role</label>
        <select [(ngModel)]="newUser.role" name="role" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-3.5 py-2.5 text-sm text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" required>
          <option value="dev">Developer</option>
          <option value="client">Client</option>
          <option value="superadmin">Admin</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">Password</label>
        <input [(ngModel)]="newUser.password" name="password" type="password" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-3.5 py-2.5 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" required>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" (click)="showModal = false" class="px-4 py-2.5 text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors rounded-xl">Cancel</button>
        <button type="submit" [disabled]="isLoading()" class="px-5 py-2.5 bg-primary text-on-primary rounded-xl hover:bg-on-primary-fixed-variant transition-colors font-semibold text-sm disabled:opacity-60 inline-flex items-center gap-2">
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Inviting...
          } @else {
            Send Invite
          }
        </button>
      </div>
    </form>
  </div>
</div>
}
