<div class="max-w-2xl mx-auto space-y-6">

  <div>
    <h1 class="font-headline-md text-headline-md text-on-surface">Account Settings</h1>
  </div>

  <!-- Profile Card -->
  <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant overflow-hidden">
    <div class="p-6 flex items-center gap-5 border-b border-outline-variant/50">
      <div class="h-16 w-16 rounded-2xl bg-primary flex items-center justify-center text-on-primary text-xl font-bold shrink-0">
        {{ authService.currentUser()?.name?.charAt(0) }}
      </div>
      <div>
        <h2 class="font-headline-md text-headline-md text-on-surface">{{ authService.currentUser()?.name }}</h2>
        <p class="text-sm text-on-surface-variant capitalize">{{ authService.currentUser()?.role }}</p>
      </div>
    </div>

    <form (submit)="onSubmit()" class="p-6 space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">Full Name</label>
          <input [(ngModel)]="profile.name" name="name" class="w-full bg-surface-container border border-outline-variant rounded-xl px-3.5 py-2.5 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" required>
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">Email</label>
          <input [(ngModel)]="profile.email" name="email" type="email" class="w-full bg-surface-container border border-outline-variant rounded-xl px-3.5 py-2.5 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" required>
        </div>
      </div>

      <div class="pt-4 border-t border-outline-variant/50">
        <label class="block text-[11px] font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">New Password <span class="text-outline font-normal">(optional)</span></label>
        <input [(ngModel)]="profile.password" name="password" type="password" class="w-full bg-surface-container border border-outline-variant rounded-xl px-3.5 py-2.5 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Leave blank to keep current">
      </div>

      <div class="flex justify-end pt-2">
        <button type="submit" class="bg-primary text-on-primary px-6 py-2.5 rounded-xl hover:bg-on-primary-fixed-variant transition-colors font-semibold text-sm">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
