<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Team Roster</h1>
      <p class="text-slate-500 text-sm mt-1">Manage access and roles.</p>
    </div>
    <button (click)="showModal = true" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 transition font-medium text-sm shadow-sm shadow-blue-200">
      + Invite Member
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (user of teamService.members(); track user._id) {
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex items-center gap-4">
        <div class="h-12 w-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold text-lg border border-slate-200">
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
        <div class="flex-1">
          <div class="font-bold text-slate-800">{{ user.name }}</div>
          <div class="text-xs text-slate-500">{{ user.email }}</div>
          <div class="mt-2">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium uppercase tracking-wide"
              [class.bg-purple-100]="user.role === 'superadmin'" [class.text-purple-800]="user.role === 'superadmin'"
              [class.bg-blue-100]="user.role === 'dev'" [class.text-blue-800]="user.role === 'dev'"
              [class.bg-green-100]="user.role === 'client'" [class.text-green-800]="user.role === 'client'">
              {{ user.role }}
            </span>
          </div>
        </div>
      </div>
    }
  </div>
</div>

@if (showModal) {
<div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50">
  <div class="bg-white p-8 rounded-xl w-full max-w-md shadow-2xl">
    <h2 class="text-xl font-bold mb-6 text-slate-800">Invite New Member</h2>
    
    <form (submit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name</label>
        <input [(ngModel)]="newUser.name" name="name" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm" required>
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
        <input [(ngModel)]="newUser.email" name="email" type="email" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm" required>
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Role</label>
        <select [(ngModel)]="newUser.role" name="role" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm" required>
          <option value="dev">Developer</option>
          <option value="client">Client</option>
          <option value="superadmin">Admin</option>
        </select>
      </div>
      <div class="mb-6">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
        <input [(ngModel)]="newUser.password" name="password" type="password" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm" required>
      </div>

      <div class="flex justify-end gap-3">
        <button type="button" (click)="showModal = false" class="px-4 py-2 text-slate-500 hover:text-slate-700 font-medium text-sm">Cancel</button>
        
        <!-- BUTTON WITH LOADING STATE -->
        <button type="submit" [disabled]="isLoading()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm disabled:opacity-50 flex items-center gap-2">
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Inviting...
          } @else {
            Send Invite
          }
        </button>
      </div>
    </form>
  </div>
</div>
}
