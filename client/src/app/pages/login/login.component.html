<div class="min-h-screen flex flex-col items-center justify-center bg-[#f8fafc] px-4">
  
  <!-- Logo Header -->
  <div class="mb-8 text-center">
    <div class="mx-auto h-12 w-12 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-blue-200 mb-4">
      W
    </div>
    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Welcome back</h1>
    <p class="text-slate-500 text-sm mt-2">Sign in to your workspace.</p>
  </div>

  <!-- Login Card -->
  <div class="bg-white w-full max-w-[400px] rounded-2xl shadow-sm border border-slate-200 p-8">
    
    <form (submit)="onSubmit()" class="space-y-5">

      <!-- Email -->
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Work Email</label>
        <input
          [(ngModel)]="email"
          name="email"
          type="email"
          class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-300"
          placeholder="name@company.com"
          required
        >
      </div>

      <!-- Password -->
      <div class="space-y-1">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Password</label>
          <a href="#" class="text-xs text-blue-600 hover:underline font-medium">Forgot?</a>
        </div>
        <input
          [(ngModel)]="password"
          name="password"
          type="password" 
          class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-300"
          placeholder="????????"
          required
        >
      </div>

      <!-- Action -->
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition-all duration-200 shadow-sm shadow-blue-200 mt-2 flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
        
        @if (isLoading()) {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
        }
      </button>

      <!-- Footer -->
      <div class="text-center pt-4 border-t border-slate-100">
        <p class="text-sm text-slate-500">
          No account? <a routerLink="/register" class="text-blue-600 font-bold hover:underline cursor-pointer">Create Agency</a>
        </p>
      </div>
    </form>
  </div>

  <!-- Footer Info -->
  <div class="mt-8 text-center text-xs text-slate-400">
    &copy; 2026 Wiilo Inc. Secure.
  </div>
</div>
