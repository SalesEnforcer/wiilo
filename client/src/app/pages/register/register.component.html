<div class="min-h-screen flex flex-col items-center justify-center bg-navy-950 px-4 py-10">
  
  <!-- Logo Header -->
  <div class="mb-8 text-center">
    <div class="mx-auto h-12 w-12 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-navy-950 font-bold text-2xl shadow-glow mb-4">
      W
    </div>
    <h1 class="text-3xl font-bold text-white tracking-tight">Initialize Agency</h1>
    <p class="text-slate-400 text-sm mt-2">Create your secure workspace</p>
  </div>

  <!-- Register Card -->
  <div class="bg-white w-full max-w-[450px] rounded-2xl shadow-2xl overflow-hidden p-8 border border-white/10">
    
    <form (submit)="onSubmit()" class="space-y-4">
      
      <!-- Agency Name -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-navy-900 uppercase tracking-wide">Agency Name</label>
        <input [(ngModel)]="orgName" name="orgName" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-navy-900 outline-none" placeholder="e.g. Acme Digital" required>
      </div>

      <!-- Full Name -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-navy-900 uppercase tracking-wide">Admin Name</label>
        <input [(ngModel)]="name" name="name" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-navy-900 outline-none" placeholder="John Doe" required>
      </div>

      <!-- Email -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-navy-900 uppercase tracking-wide">Work Email</label>
        <input [(ngModel)]="email" name="email" type="email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-navy-900 outline-none" placeholder="admin@agency.com" required>
      </div>

      <!-- Password -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-navy-900 uppercase tracking-wide">Password</label>
        <input [(ngModel)]="password" name="password" type="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-navy-900 outline-none" placeholder="????????" required>
      </div>

      <!-- Action -->
      <button 
        type="submit" 
        class="w-full bg-navy-900 text-white font-bold py-3.5 rounded-lg hover:bg-navy-800 transition-all duration-200 shadow-lg mt-4">
        Deploy Workspace
      </button>

      <!-- Footer -->
      <div class="text-center pt-4 border-t border-slate-100 mt-2">
        <p class="text-sm text-slate-500">
          Already live? <a routerLink="/login" class="text-gold-600 font-bold hover:underline cursor-pointer">Access Terminal</a>
        </p>
      </div>
    </form>
  </div>
</div>
