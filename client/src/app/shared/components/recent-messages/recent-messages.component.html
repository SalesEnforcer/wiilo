<div class="bg-surface-container-lowest rounded-2xl border border-outline-variant flex flex-col h-full overflow-hidden">
  <div class="p-4 border-b border-outline-variant/50 flex justify-between items-center gap-2">
    <h3 class="font-semibold text-on-surface text-sm truncate">Recent Discussions</h3>
    <span class="text-[10px] text-on-surface-variant font-semibold uppercase tracking-wider bg-surface-container px-2 py-0.5 rounded-lg border border-outline-variant/30 shrink-0">Latest 5</span>
  </div>

  <div class="flex-1 overflow-y-auto p-2">
    @for (msg of chatService.recentMessages(); track msg._id) {
      <a [routerLink]="['/' + (authService.getRole() === 'client' ? 'portal' : 'projects'), msg.project._id]"
         [queryParams]="{ tab: 'chat' }"
         class="block p-3 rounded-xl hover:bg-surface-container transition group cursor-pointer border border-transparent hover:border-outline-variant/30">

        <div class="flex justify-between items-start mb-1">
          <div class="flex items-center gap-2">
            <div class="h-6 w-6 rounded-lg bg-primary-container/20 text-primary flex items-center justify-center text-[10px] font-bold shrink-0">
              {{ msg.sender.name.charAt(0).toUpperCase() }}
            </div>
            <span class="text-xs font-semibold text-on-surface">{{ msg.sender.name }}</span>
          </div>
          <span class="text-[10px] text-on-surface-variant shrink-0">{{ msg.createdAt | date:'shortTime' }}</span>
        </div>

        <div class="pl-8">
          <p class="text-sm text-on-surface-variant truncate">{{ msg.content }}</p>
          <p class="text-[10px] text-on-surface-variant mt-1 flex items-center gap-1 group-hover:text-primary transition-colors">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
            {{ msg.project.name }}
          </p>
        </div>
      </a>
    } @empty {
      <div class="p-10 text-center text-on-surface-variant text-sm flex flex-col items-center">
        <svg class="w-8 h-8 mb-2 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
        <span>No recent messages</span>
      </div>
    }
  </div>
</div>
