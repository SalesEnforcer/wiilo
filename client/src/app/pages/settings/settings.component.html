<div class="max-w-2xl mx-auto space-y-6">
  
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-slate-800">Account Settings</h1>
  </div>

  <!-- Profile Card -->
  <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
    <div class="flex items-center gap-6 mb-8">
      <div class="h-20 w-20 rounded-full bg-slate-900 text-white flex items-center justify-center text-2xl font-bold">
        {{ authService.currentUser()?.name?.charAt(0) }}
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-800">{{ authService.currentUser()?.name }}</h2>
        <p class="text-slate-500 capitalize">{{ authService.currentUser()?.role }}</p>
      </div>
    </div>

    <form (submit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name</label>
          <input [(ngModel)]="profile.name" name="name" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 focus:bg-white transition" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
          <input [(ngModel)]="profile.email" name="email" type="email" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 focus:bg-white transition" required>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-100 mt-4">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">New Password (Optional)</label>
        <input [(ngModel)]="profile.password" name="password" type="password" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 focus:bg-white transition" placeholder="Leave blank to keep current">
      </div>

      <div class="flex justify-end pt-4">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg hover:bg-blue-700 transition font-medium text-sm shadow-sm shadow-blue-200">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
